services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    volumes:
      - ./instance:/app/instance
      - ./web/public/uploads:/app/public/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/instance/albricias.db
      - API_TOKEN=${API_TOKEN:-dev-token}
    restart: unless-stopped

volumes:
  instance:
